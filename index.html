<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A3 Collage Maker — High Quality PDF Generator</title>
    <meta name="description" content="Create stunning A3 photo collages from your images. Upload photos, arrange in customizable grids, and download high-quality PDF sheets.">

    <!-- Geist Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/style.min.css" rel="stylesheet">

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Ambient wandering blue squares background -->
    <div class="ambient-squares" aria-hidden="true">
        <div class="wandering-square sq-1"></div>
        <div class="wandering-square sq-2"></div>
        <div class="wandering-square sq-3"></div>
        <div class="wandering-square sq-4"></div>
        <div class="wandering-square sq-5"></div>
    </div>

    <div id="app">
        <!-- Header -->
        <header id="header">
            <div class="header-content">
                <div class="logo">
                    <svg class="logo-mark" width="22" height="22" viewBox="0 0 22 22" fill="none">
                        <rect x="1" y="1" width="9" height="9" rx="1.5" fill="#111"/>
                        <rect x="12" y="1" width="9" height="9" rx="1.5" fill="#111" opacity="0.55"/>
                        <rect x="1" y="12" width="9" height="9" rx="1.5" fill="#111" opacity="0.55"/>
                        <rect x="12" y="12" width="9" height="9" rx="1.5" fill="#111" opacity="0.25"/>
                    </svg>
                    <span class="logo-text">A3 Collage Maker</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main id="main">

            <!-- Step 1: Upload -->
            <section id="upload-section" class="section active">
                <div class="section-label">
                    <span class="label-num">01</span>
                    <h2>Upload images</h2>
                </div>

                <div class="upload-card" id="upload-card">
                    <div class="drop-zone" id="drop-zone">
                        <div class="drop-icon-wrap">
                            <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect x="4" y="8" width="32" height="24" rx="3" stroke="#999" stroke-width="1.5" fill="none"/>
                                <path d="M4 25l9-7 6 5 7-9 10 11" stroke="#bbb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                                <circle cx="13" cy="15" r="2.5" stroke="#bbb" stroke-width="1.5" fill="none"/>
                                <path d="M20 4v6M17 7h6" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <p class="drop-primary">Drop images or a ZIP here</p>
                        <p class="drop-secondary">JPG, PNG, WebP, BMP, GIF</p>
                    </div>

                    <div class="upload-actions">
                        <button class="btn" id="btn-upload-images">Upload images</button>
                        <button class="btn btn-muted" id="btn-upload-folder">Select folder</button>
                        <button class="btn btn-muted" id="btn-upload-zip">Upload ZIP</button>
                    </div>

                    <input type="file" id="input-images" multiple accept="image/*" hidden>
                    <input type="file" id="input-folder" webkitdirectory hidden>
                    <input type="file" id="input-zip" accept=".zip" hidden>
                </div>

                <!-- Status bar -->
                <div class="status-bar" id="upload-status" style="display:none;">
                    <div class="status-left">
                        <span class="status-dot"></span>
                        <span id="image-count">0 images</span>
                    </div>
                    <div class="status-right">
                        <button class="link-btn" id="btn-add-more">Add more</button>
                        <span class="sep">·</span>
                        <button class="link-btn link-danger" id="btn-clear-all">Clear all</button>
                    </div>
                </div>

                <!-- Thumbnail strip -->
                <div class="thumb-strip" id="thumbnail-strip" style="display:none;"></div>
            </section>

            <!-- Step 2: Configure -->
            <section id="config-section" class="section" style="display:none;">
                <div class="section-label">
                    <span class="label-num">02</span>
                    <h2>Configure layout</h2>
                </div>

                <div class="config-rows">
                    <!-- Orientation -->
                    <div class="config-row">
                        <span class="config-key">Orientation</span>
                        <div class="seg-control" id="orientation-toggle">
                            <button class="seg active" data-value="landscape">Landscape</button>
                            <button class="seg" data-value="portrait">Portrait</button>
                        </div>
                    </div>

                    <!-- Images per sheet -->
                    <div class="config-row">
                        <span class="config-key">Per sheet</span>
                        <div class="chip-row" id="preset-chips">
                            <button class="chip" data-count="2">2</button>
                            <button class="chip" data-count="4">4</button>
                            <button class="chip" data-count="6">6</button>
                            <button class="chip" data-count="8">8</button>
                            <button class="chip" data-count="9">9</button>
                            <button class="chip" data-count="12">12</button>
                            <button class="chip" data-count="16">16</button>
                            <button class="chip" data-count="20">20</button>
                            <button class="chip active" data-count="24">24</button>
                            <button class="chip" data-count="30">30</button>
                            <button class="chip" data-count="35">35</button>
                            <button class="chip" data-count="40">40</button>
                            <button class="chip" data-count="48">48</button>
                            <button class="chip" data-count="60">60</button>
                        </div>
                    </div>

                    <!-- Grid -->
                    <div class="config-row">
                        <span class="config-key">Grid</span>
                        <div class="grid-control">
                            <input type="number" id="input-rows" min="1" max="12" value="4" class="num-input">
                            <span class="x-sep">×</span>
                            <input type="number" id="input-cols" min="1" max="12" value="6" class="num-input">
                            <span class="eq-label">= <strong id="grid-total">24</strong></span>
                        </div>
                    </div>

                    <!-- Padding -->
                    <div class="config-row">
                        <span class="config-key">Padding</span>
                        <div class="slider-row">
                            <input type="range" id="input-padding" min="0" max="10" value="5" step="0.5">
                            <span class="slider-val" id="padding-value">5 mm</span>
                        </div>
                    </div>

                    <!-- Margin -->
                    <div class="config-row">
                        <span class="config-key">Margin</span>
                        <div class="slider-row">
                            <input type="range" id="input-margin" min="0" max="20" value="5" step="1">
                            <span class="slider-val" id="margin-value">5 mm</span>
                        </div>
                    </div>

                    <!-- Background -->
                    <div class="config-row">
                        <span class="config-key">Background</span>
                        <div class="color-row">
                            <input type="color" id="input-bg-color" value="#ffffff">
                            <span class="color-label" id="bg-color-label">#FFFFFF</span>
                        </div>
                    </div>
                </div>

                <div class="summary-line" id="config-summary">
                    <strong id="summary-pages">0</strong> pages · <strong id="summary-images">0</strong> images
                </div>

                <div class="generate-row">
                    <button class="btn btn-dark btn-wide" id="btn-generate">Generate preview</button>
                </div>
            </section>

            <!-- Step 3: Preview & Download -->
            <section id="preview-section" class="section" style="display:none;">
                <div class="section-label">
                    <span class="label-num">03</span>
                    <h2>Preview & download</h2>
                </div>

                <div class="preview-actions">
                    <button class="btn btn-blue btn-large" id="btn-download-pdf">
                        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M10 3v9m0 0l-3.5-3.5M10 12l3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M4 14.5v1a1.5 1.5 0 001.5 1.5h9a1.5 1.5 0 001.5-1.5v-1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        Download full PDF
                    </button>
                </div>

                <div class="preview-list" id="preview-grid"></div>
            </section>
        </main>

        <!-- Footer -->
        <footer id="footer">
            <span>MADE BY ALVIN</span>
        </footer>

        <!-- Progress overlay -->
        <div class="overlay" id="progress-overlay" style="display:none;">
            <div class="overlay-card">
                <div class="spinner"></div>
                <p class="overlay-title" id="progress-text">Processing...</p>
                <div class="bar-track">
                    <div class="bar-fill" id="progress-bar"></div>
                </div>
                <p class="overlay-sub" id="progress-detail"></p>
            </div>
        </div>

        <!-- Toasts -->
        <div class="toast-stack" id="toast-container"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
